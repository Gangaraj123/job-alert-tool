name: Daily job alert

on:
  schedule:
    # 01:17 UTC = 06:47 IST.
    #
    # Deliberately an odd minute, off the hour. GitHub runs scheduled
    # workflows on a best-effort basis and queues them behind peak load;
    # at "0 3" this job fired 4.5-5.5 hours late every day for eleven days
    # straight, turning a morning digest into an afternoon one. Contended
    # slots are the top of the hour and the midnight-to-03:00 UTC band.
    # Even with an hour or two of drift this still lands in the morning IST.
    - cron: "17 1 * * *"
  workflow_dispatch: {}  # allows manual "Run workflow" from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run pipeline
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          APP_URL: ${{ secrets.APP_URL }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERTEX_PROJECT: ${{ secrets.VERTEX_PROJECT }}
          VERTEX_LOCATION: ${{ secrets.VERTEX_LOCATION }}
          GOOGLE_VERTEX_CREDENTIALS_JSON: ${{ secrets.GOOGLE_VERTEX_CREDENTIALS_JSON }}
        run: python -m src.main

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: job-alert-log
          path: job_alert.log
          if-no-files-found: ignore
