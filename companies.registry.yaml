  # --- Self-hosted boards with a usable public API -------------------------
  # Amazon is scoped by ISO-3166 alpha-3 country code, not a tenant slug.
  - {name: Amazon,      domain: amazon.com,      method: "amazon:IND"}                 # 288 (India)

  # --- Known to need bespoke handling --------------------------------------
  # Each of these has a careers site but no public ATS API we have found yet.
  # Left as `pending` deliberately: better an honest gap than a fetcher that
  # silently returns nothing and looks healthy.
  # Applications go through iCIMS, but Atlassian publishes its own JSON
  # listing with qualifications text included.
  - {name: Atlassian,   domain: atlassian.com,   method: "atlassian:listings"}  # 357
  # Workday tenant cohesity.wd1 answers but rejects every site name tried;
  # their own careers page yields nothing renderable.
  - {name: Cohesity,    domain: cohesity.com,    method: pending}
  # No public ATS API, but their listing page renders and yields job links.
  - {name: Confluent,   domain: confluent.io,    method: auto,
     careers_url: "https://careers.confluent.io/jobs"}
  # Their careers page is a Greenhouse board under the slug "gleanwork";
  # the API gives the same 129 roles WITH descriptions, which rendering
  # does not. (A stray SmartRecruiters tenant holds one posting -- ignore.)
  - {name: Glean,       domain: glean.com,       method: "greenhouse:gleanwork"}  # 129
  - {name: Rippling,    domain: rippling.com,    method: auto,
     careers_url: "https://www.rippling.com/careers/open-roles"}               # 33
  - {name: Automattic,  domain: automattic.com,  method: auto,
     careers_url: "https://automattic.com/work-with-us/jobs/"}                 # 12
  - {name: HashiCorp,   domain: hashicorp.com,   method: pending}
  - {name: Razorpay,    domain: razorpay.com,    method: pending}
  - {name: Zerodha,     domain: zerodha.com,     method: pending}
  # lever:eternal is a DIFFERENT company (performance technicians, NYC/SF),
  # not Zomato's parent. Not wired up.
  - {name: Zomato,      domain: zomato.com,      method: pending}
  - {name: Flipkart,    domain: flipkart.com,    method: pending}
  - {name: PhonePe,     domain: phonepe.com,     method: pending}
  - {name: Postman,     domain: postman.com,     method: pending}
  - {name: Zoho,        domain: zoho.com,        method: pending}
  - {name: Dream11,     domain: dream11.com,     method: pending}
  - {name: Zepto,       domain: zepto.co.in,     method: pending}
  - {name: Netflix,     domain: netflix.com,     method: pending}
  # Jibe/iCIMS site: the listing page carries no JobPosting markup, but the
  # platform's own /api/jobs endpoint returns all 254 with descriptions.
  - {name: DocuSign,    domain: docusign.com,    method: "jibe:careers.docusign.com"}  # 254
  # Microsoft retired its public search API (gcsservices.careers.microsoft.com
  # now serves an Azure CDN cert for a different host). The SPA renders, so
  # the browser tier handles it.
  - {name: Microsoft,   domain: microsoft.com,   method: auto,
     careers_url: "https://jobs.careers.microsoft.com/global/en/search?lc=India"}
  # LinkedIn HAS a Lever board (jobs.lever.co/linkedin) but it is a test
  # tenant: "Deauth Test", "Bug Bash Job 2". Deliberately NOT wired up --
  # it would feed fake listings that look entirely real.
  - {name: LinkedIn,    domain: linkedin.com,    method: pending}
  # Uber's SmartRecruiters tenant holds a single "Test UAT" posting -- a QA
  # board, like LinkedIn's. Not wired up.
  - {name: Uber,        domain: uber.com,        method: pending}
  # Wayfair's SmartRecruiters tenant has one unrelated retail role; the real
  # board is elsewhere.
  - {name: Wayfair,     domain: wayfair.com,     method: pending}
  - {name: Broadcom,    domain: broadcom.com,    method: pending}
  # Job cards are unlinked divs with obfuscated classes, so nothing to
  # extract from the DOM -- but the page's own GraphQL response carries
  # ids, titles and locations. No descriptions, so the experience filter
  # falls open for these.
  - {name: Meta,        domain: meta.com,        method: "meta:"}             # 412
  - {name: Deel,        domain: deel.com,        method: pending}
  - {name: Apple,       domain: apple.com,       method: pending}
  - {name: Indeed,      domain: indeed.com,      method: pending}
