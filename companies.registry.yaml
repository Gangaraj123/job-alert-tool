  - {name: Canva,       domain: canva.com,       method: "smartrecruiters:canva"}      # 100+

  # --- Self-hosted boards with a usable public API -------------------------
  # Amazon is scoped by ISO-3166 alpha-3 country code, not a tenant slug.
  - {name: Amazon,      domain: amazon.com,      method: "amazon:IND"}                 # 288 (India)

  # --- Known to need bespoke handling --------------------------------------
  # Each of these has a careers site but no public ATS API we have found yet.
  # Left as `pending` deliberately: better an honest gap than a fetcher that
