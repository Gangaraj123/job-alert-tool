# Curated company registry.
#
# Adding a company in the UI only needs its NAME. If the name matches an entry
# here, the company is tracked immediately with a verified fetch method. If it
# doesn't, it is still saved — as `pending` — and shows up in the UI's "needs
# setup" list, to be given an entry here whenever we next look at it. Adding a
# company must never fail or make the user hunt for a URL.
#
# method:
#   <ats>:<slug>  — fetched via that ATS's public API. Verified: the job count
#                   in the comment is what the API returned when it was added.
#   auto          — no known ATS; fall back to the generic tiers (JSON-LD,
#                   link extraction, browser render).
#   pending       — not yet investigated. Never fetched, never reported broken.
#
# domain is only used to build the logo URL.

companies:
  # --- Verified ATS boards -------------------------------------------------
  - {name: Databricks,  domain: databricks.com,  method: "greenhouse:databricks"}      # 898
  - {name: Rubrik,      domain: rubrik.com,      method: "greenhouse:rubrik"}          # 145
  - {name: Stripe,      domain: stripe.com,      method: "greenhouse:stripe"}          # 729
