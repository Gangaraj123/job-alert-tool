# Tuning knobs for the pipeline. The company list itself lives in the DB (edit it
# via the Streamlit UI) — this file is everything else.

filters:
  # A job passes the pre-filter if its title+description contains ANY of these
  # (case-insensitive substring match). Empty list = no keyword filtering.
  keywords:
    - "founding engineer"
    - "staff engineer"
    - "backend"
    - "full stack"
    - "platform engineer"
    - "infrastructure"
  # A job passes if its location contains ANY of these, OR is remote-friendly.
  # Empty list = no location filtering.
  locations:
    - "remote"
    - "bengaluru"
    - "bangalore"
    - "india"
  # If true, a job whose location string contains "remote" always passes the
  # location filter even if it doesn't match the list above.
  always_allow_remote: true

fetch:
  request_timeout_seconds: 20
  max_retries: 3
  retry_backoff_seconds: 2
  # Re-detect a company's ATS after this many days even if cached.
  ats_cache_ttl_days: 14
  # Sitemap discovery tier: cap how many candidate job URLs it will visit.
  max_sitemap_urls: 25

logging:
  level: INFO
  file: job_alert.log
