# Tuning knobs for the pipeline. The company list AND the role/location
# filters live in the DB (edit them via the Streamlit UI) — this file is
# everything else.

fetch:
  request_timeout_seconds: 20
  max_retries: 3
  retry_backoff_seconds: 2
  # Re-detect a company's ATS after this many days even if cached.
  ats_cache_ttl_days: 14
  # Sitemap discovery tier: cap how many candidate job URLs it will visit.
  max_sitemap_urls: 25

discovery:
  # Used by "Add company" career-page discovery, search-result reranking,
  # and the experience/education-level job check. Needs GEMINI_API_KEY
  # (preferred) or Vertex AI credentials as a fallback — without either,
  # these features just use their non-AI fallback.
  #
  # NOTE: "gemini-2.5-flash" returns 404 "no longer available to new users"
  # on at least one AI Studio key tested — confirmed working via direct curl
  # test against this exact key/endpoint. If this starts failing, check
  # https://ai.google.dev/gemini-api/docs/models for the current name.
  gemini_model: gemini-3.8-flash

logging:
  level: INFO
  file: job_alert.log
