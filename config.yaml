# Tuning knobs for the pipeline. The company list AND the role/location
# filters live in the DB (edit them via the Streamlit UI) — this file is
# everything else.

fetch:
  # Companies are fetched concurrently (each is mostly network/browser
  # wait, and they're independent). Bounded so a long company list can't
  # spawn an unbounded number of headless browsers at once.
  max_concurrent_companies: 4
  request_timeout_seconds: 20
  max_retries: 3
  retry_backoff_seconds: 2
  # Re-detect a company's ATS after this many days even if cached.
  ats_cache_ttl_days: 14
  # Sitemap discovery tier: cap how many candidate job URLs it will visit.
  max_sitemap_urls: 25

discovery:
  # Used by "Add company" career-page discovery, search-result reranking,
  # and the experience/education-level job check. Needs GEMINI_API_KEY
  # (preferred) or Vertex AI credentials as a fallback — without either,
  # these features just use their non-AI fallback.
  #
  # Model names differ PER BACKEND — verified by direct API calls:
  #   * AI Studio rejects "gemini-2.5-flash" with 404 "no longer available
  #     to new users" and recommends gemini-3.8-flash.
  #   * Vertex doesn't serve "gemini-3.8-flash" (404) but does serve
  #     "gemini-2.5-flash".
  # Using one shared name silently broke cross-backend failover, so each
  # backend gets its own. If either starts 404ing, check
  # https://ai.google.dev/gemini-api/docs/models for current names.
  gemini_model: gemini-3.8-flash
  vertex_model: gemini-2.5-flash

logging:
  level: INFO
  file: job_alert.log
