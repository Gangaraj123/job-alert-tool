# Tuning knobs for the pipeline. The company list AND the role/location
# filters live in the DB (edit them via the Streamlit UI) — this file is
# everything else.

fetch:
  request_timeout_seconds: 20
  max_retries: 3
  retry_backoff_seconds: 2
  # Re-detect a company's ATS after this many days even if cached.
  ats_cache_ttl_days: 14
  # Sitemap discovery tier: cap how many candidate job URLs it will visit.
  max_sitemap_urls: 25

discovery:
  # Used only by the "Add company" career-page discovery in the UI, as a
  # fallback after plain URL-pattern guessing fails. Needs GEMINI_API_KEY —
  # without it, discovery just uses the pattern guesses.
  gemini_model: gemini-3.8-flash

logging:
  level: INFO
  file: job_alert.log
