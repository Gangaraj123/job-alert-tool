# Tuning knobs for the pipeline. The company list AND the role/location
# filters live in the DB (edit them via the Streamlit UI) — this file is
# everything else.

fetch:
  request_timeout_seconds: 20
  max_retries: 3
  retry_backoff_seconds: 2
  # Re-detect a company's ATS after this many days even if cached.
  ats_cache_ttl_days: 14
  # Sitemap discovery tier: cap how many candidate job URLs it will visit.
  max_sitemap_urls: 25

discovery:
  # Used by "Add company" career-page discovery (AI-first) and search-result
  # reranking in the UI. Needs either Vertex AI credentials (preferred —
  # VERTEX_PROJECT + GOOGLE_VERTEX_CREDENTIALS_JSON) or GEMINI_API_KEY as a
  # fallback — without either, these features just use their non-AI fallback.
  gemini_model: gemini-2.5-flash

logging:
  level: INFO
  file: job_alert.log
